# Workflow simplificado: compila los scripts TypeScript en JS puro antes de ejecutarlos
# para evitar dependencias de tsx en entornos CI donde pueda fallar.
name: Sincronizar Tarragona

on:
  schedule:
    - cron: '0 5 * * *'   # 05:00 UTC = 06:00/07:00 en Tarragona
  workflow_dispatch: {}    # botón "Run workflow" para lanzarlo a mano

concurrency:
  group: sincronizar-tarragona
  cancel-in-progress: false

jobs:
  sincronizar:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Sincronizar fuentes abiertas → Supabase
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          SYNC_MUNICIPIOS_EMPLEO: ${{ vars.SYNC_MUNICIPIOS_EMPLEO }}
        run: |
          echo "Node: $(node --version)"
          echo "SUPABASE_URL set: ${{ secrets.SUPABASE_URL != '' }}"
          echo "SERVICE_KEY set: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY != '' }}"
          npx tsx scripts/sync/index.ts
