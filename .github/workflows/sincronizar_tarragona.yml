name: Sincronizar Tarragona

on:
  schedule:
    - cron: '0 5 * * *'   # 05:00 UTC = 06:00/07:00 en Tarragona
  workflow_dispatch: {}    # boton Run workflow para lanzarlo a mano

concurrency:
  group: sincronizar-tarragona
  cancel-in-progress: false

jobs:
  sincronizar:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Verificar secretos
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          echo "Node: $(node --version)"
          echo "SUPABASE_URL configurada: ${{ secrets.SUPABASE_URL != '' }}"
          echo "SERVICE_KEY configurada: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY != '' }}"
          node -e "
            if (!process.env.SUPABASE_URL) { console.error('ERROR: SUPABASE_URL no configurada'); process.exit(1); }
            if (!process.env.SUPABASE_SERVICE_ROLE_KEY) { console.error('ERROR: SUPABASE_SERVICE_ROLE_KEY no configurada'); process.exit(1); }
            console.log('Secretos OK - proyecto:', process.env.SUPABASE_URL.split('.')[0].split('//')[1]);
          "

      - name: Sincronizar fuentes abiertas con Supabase
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          SYNC_MUNICIPIOS_EMPLEO: ${{ vars.SYNC_MUNICIPIOS_EMPLEO }}
        run: |
          echo "=== INICIO SINCRONIZACION $(date -u) ==="
          npx tsx scripts/sync/index.ts
          echo "=== FIN SINCRONIZACION ==="
